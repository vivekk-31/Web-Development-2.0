<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM adding and removing elements</title>
</head>

<body>
    <div class="container">
        <div class="box">
            <div class="box1"></div>
            <div class="box2"></div>
            <div class="box3"></div>
            <div class="box4"></div>
            <div class="box5"></div>
        </div>
    </div>
    <script>
        let cont = document.body.getElementsByClassName(".container")
        console.log(cont)
        let cont1 = document.querySelector(".container")
        cont1.insertAdjancentHTML("afterbegin", "<b> This is after container. </b>")
        let node1 = document.querySelector(".box1")
        node1.remove()
    </script>
</body>
</html>
