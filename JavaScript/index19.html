<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercie - Promises</title>
    <style>
        .container {
            border: 2px solid black;
            width: 50vw;
            height: 50vh;
        }

        .button {
            height: 40px;
            width: 150px;
            /* border: 2px solid black; */
            padding: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
            border-radius: 50px;
            background-color: rgb(90, 207, 237);
            cursor: pointer;
        }

        .button:hover {
            background-color: rgb(49, 198, 244);
            transition: ease-in-out 1s;
        }

        .button:active {
            width: 130px;
            transition: ease-in-out 1s;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="button">Click Me</div>
        <script src="script19.js"></script>
    </div>
</body>

</html>
