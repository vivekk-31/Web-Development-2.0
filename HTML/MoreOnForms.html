<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on Forms</title>
</head>

<body>
    <h1>Your Form</h1>
    <form action="#submit">
        <label for="name">Name </label>
        <input type="text" id="name" name="name" placeholder="Enter Your Name here" required>
        <br> <br>

        <label for="phoneNumber">Phone Number </label>
        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter Your Phone Number" required>
        <br> <br>

        <input type="radio" id="male" name="gender" value="male" required>
        <label for="gender">Male </label>

        <input type="radio" id="female" name="gender" value="female" required>
        <label for="gender">Female </label>
        <br> <br>

        <label for="age">Age </label>
        <input type="number" id="age" name="age" placeholder="Enter your age" required>
        <br> <br>

        <label for="password">Password </label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <br> <br>

        <label for="password">Confirm Password </label>
        <input type="password" id="conPassword" name="conPassword" placeholder="Re-enter your password" required>
        <br> <br>

        <p>Choose your hobby</p>
        <input type="checkbox" id="playing" value="playing">
        <label for="playing">Playing</label>
        
        <input type="checkbox" id="singing" value="singing">
        <label for="singing">Singing</label>

        <input type="checkbox" id="dancing" value="dancing">
        <label for="dancing">Dancing</label>

        <input type="checkbox" id="writing" value="writing">
        <label for="Writing">Writing</label>
        <br><br>

        <label for="city">Choose a city:</label>
        <select name="city" id="city">
            <option value="Delhi">Delhi</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Bangalore">Bangalore</option>
        </select>
        <br><br>

        <textarea name="description" id="description"></textarea><br><br>

        <button id="submit">Submit</button>
    </form>
</body>

</html>
