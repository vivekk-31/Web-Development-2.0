<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists - Ordered and Unordered</title>
</head>
<body>
    <h1>Lists</h1>
    <ul>
        <li>Apple</li>
        <li>Samsung</li>
        <li>Redmi</li>
    </ul>
    <ol>
        <li>Apple</li>
        <li>Samsung</li>
        <li>Redmi</li>
    </ol>
    <dl>
        <dt>
            HTML
            <dd>HTML is a markup language</dd>
        </dt>
    </dl>
    <ul>
        <li>Fruits</li>
        <ul>Apple</ul>
        <ul>Mango</ul>
    </ul>
</body>
</html>
