<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        .img1{
            height: 300px;
            width: 450px;
            filter: blur(3px);
        }
        .img2{
            /* filter: brightness(2); */
            filter: grayscale(2);
        }
        .img3{
            filter: invert(1);
            filter: opacity(1);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://images.pexels.com/photos/546819/pexels-photo-546819.jpeg" alt="Coding Image">
        <img class="img2" src="https://tse1.mm.bing.net/th/id/OIP.gxyjiwgMW8DO88akh7ms0AHaHa?pid=Api&P=0&h=180" alt="Damon Salvatore Image">
        <img class="img3" src="https://tse1.mm.bing.net/th/id/OIP.kVutHk2zAvHZQyV66_pvDQHaHa?pid=Api&P=0&h=180" alt="Elijah Mikaelson Image">
    </div>
</body>
</html>
