<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    <link rel="stylesheet" href="style.css">

<body>
    <header>
        <nav>
            <ul>
                <li class="logo">गीत</li>
                <li><input name="searchBar" type="text" placeholder="What do you want to play?"></li>
                <li></li>
            </ul>
        </nav>
    </header>
    <main class="player">
        <section class=" sections playlist">

        </section>
        <section class=" sections songsDisplay">

        </section>
        <section class=" sections nowPlaying">
            <div class="currentSong">
                
            </div>
            <div class="queue">
                <p class="UpNext">
                  <h4>Up Next</h4>
                </p>
            </div>
        </section>

        <section class="songControls">
            <div class="controls">
                <div class="left"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M491 100.8C478.1 93.8 462.3 94.5 450 102.6L192 272.1L192 128C192 110.3 177.7 96 160 96C142.3 96 128 110.3 128 128L128 512C128 529.7 142.3 544 160 544C177.7 544 192 529.7 192 512L192 367.9L450 537.5C462.3 545.6 478 546.3 491 539.3C504 532.3 512 518.8 512 504.1L512 136.1C512 121.4 503.9 107.9 491 100.9z"/></svg></div>

                </div>

            </div>
            <div class="durationBox">
            <div class="currentTime"></div>
            <div class="seekbar">
                <div class="tracker"></div>
            </div>
            <div class="duration"></div>
            </div>
        </section>
        <script src="script.js"></script>
    </main>
    <footer>

    </footer>
</body>

</html>
